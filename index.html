<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ping Watch — Browser Connection Monitor</title>
<meta name="description" content="Ping Watch is a browser-based connection monitor: HTTP latency tracking, a live graph, outage history and an internet speed test. Everything runs locally — no backend, no accounts, no data leaves your machine.">
<meta name="theme-color" content="#050a18">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%235ad1e6' stroke-width='10'/><circle cx='50' cy='50' r='10' fill='%23a6fff2'/></svg>">
<style>
:root{
  --bg:#050a18;
  --ocean:#1b2a4a;
  --land:#5ad1e6;
  --land2:#a6fff2;
  --green:#3ddc84;
  --coral:#ff6f61;
  --gold:#ffd166;
  --fg:#e8f3ff;
  --dim:rgba(200,222,245,.58);
  --line:rgba(120,170,220,.16);
  --geo:"Futura","Century Gothic","Avenir Next","URW Gothic","Poppins","Trebuchet MS",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Menlo","Consolas","DejaVu Sans Mono",monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--geo);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 10px var(--panel-width,minmax(320px,min(42vw,600px)));transition:filter .25s ease}
.app.offline-mode{filter:grayscale(.35) brightness(.84)}
.resize-handle{position:relative;z-index:8;cursor:col-resize;touch-action:none;outline:none}
.resize-handle::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:2px;background:var(--line);transition:background-color .15s,transform .15s}
.resize-handle:hover::after,.resize-handle:focus-visible::after,.app.resizing .resize-handle::after{background:var(--land);transform:scaleX(1.5)}
.app.resizing,.app.resizing *{cursor:col-resize!important;user-select:none!important}
.stage{position:relative;overflow:hidden;min-width:0}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.drag{cursor:grab}

.title{position:absolute;left:clamp(18px,3vw,44px);top:clamp(18px,4vh,40px);z-index:2;pointer-events:none;max-width:min(520px,90%)}
.title .eyebrow{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--land)}
.title h1{font-weight:400;font-size:clamp(38px,4.6vw,66px);letter-spacing:-.01em;line-height:1;margin-top:10px}
.title h1 span{color:var(--land2)}
.title p{margin-top:10px;font-size:13px;letter-spacing:.06em;color:var(--dim)}

/* big live readout on the stage */
.readout{margin-top:clamp(14px,2.4vh,26px);display:flex;align-items:center;gap:18px;pointer-events:none}
.readout .pill{display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(8,16,36,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.readout .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);flex:0 0 auto}
.stage[data-state="on"] .readout .dot{animation:pulse 2s ease-out infinite}
.stage[data-state="off"] .readout .dot{background:var(--coral);box-shadow:0 0 10px var(--coral);animation:pulse 1s ease-out infinite}
.stage[data-state="off"] .readout .pill{color:#ffb1a9;border-color:rgba(255,111,97,.45)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 11px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.stage[data-state="off"] .readout .dot{animation-name:pulseOff}
@keyframes pulseOff{0%{box-shadow:0 0 0 0 rgba(255,111,97,.55)}70%{box-shadow:0 0 0 11px rgba(255,111,97,0)}100%{box-shadow:0 0 0 0 rgba(255,111,97,0)}}
.readout .ms{font-weight:400;font-size:clamp(44px,5.2vw,72px);line-height:1;letter-spacing:-.02em;color:var(--land2);font-variant-numeric:tabular-nums}
.stage[data-state="off"] .readout .ms{color:var(--coral)}
.readout .ms small{font-size:16px;color:var(--dim);margin-left:6px;letter-spacing:.06em;font-family:var(--geo)}
.target{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(460px,80vw)}
.reason{margin-top:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ffb1a9;min-height:14px}

.speedcard{position:absolute;left:clamp(18px,3vw,44px);bottom:clamp(18px,4vh,36px);z-index:2;width:min(330px,42vw);display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;background:rgba(8,16,36,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:14px 16px}
.speedcard .sptitle{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.speedcard .scard{background:rgba(255,255,255,.03)}
.speedcard .bar{position:relative}

/* ---------- side panel ---------- */
.panel{position:relative;z-index:4;border-left:1px solid var(--line);background:linear-gradient(180deg,rgba(12,22,46,.72),rgba(6,12,28,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;overflow-x:hidden;min-width:0}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:rgba(120,170,220,.2);border-radius:4px}
.panel header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel h2{font-weight:400;font-size:22px;letter-spacing:.02em}

.field label{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.field input[type=url]{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-family:var(--mono);font-size:13px;letter-spacing:.02em;outline:none;transition:border-color .2s}
.field input[type=url]:focus{border-color:rgba(166,255,242,.55)}
.field input[type=url].err{border-color:rgba(255,111,97,.6)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.controls select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;letter-spacing:.08em;outline:none;cursor:pointer}
.controls select option{background:#0b1630}
#clearB{padding:10px 12px;font-size:11px}
button.ghost{padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:background-color .2s,color .2s}
button.ghost:hover{background:rgba(90,209,230,.1);color:var(--fg)}
button.ghost:focus-visible{outline:2px solid var(--land);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}

.graphcard{border:1px solid var(--line);border-radius:14px;background:rgba(8,16,36,.5);padding:14px 12px 10px}
.graphhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 8px}
.graphhead .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.winsel{display:flex;gap:4px}
.winsel button{padding:4px 9px;border-radius:999px;border:1px solid transparent;background:none;font-size:10px;letter-spacing:.12em;color:var(--dim);cursor:pointer}
.winsel button:hover{color:var(--fg)}
.winsel button[aria-pressed="true"]{border-color:rgba(166,255,242,.45);color:var(--land2)}
#graph{display:block;width:100%;height:210px;cursor:crosshair}
.gwrap{position:relative}
.gtip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;padding:7px 10px 8px;border-radius:8px;background:rgba(8,16,36,.88);border:1px solid rgba(166,255,242,.35);opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.gtip.on{opacity:1}
.gtip b{display:block;font-weight:500;font-size:13px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.gtip span{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.gtip.off b{color:var(--coral)}

.grid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 14px;padding-top:14px;border-top:1px solid var(--line)}
.stat .lbl{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stat b{display:block;font-weight:400;font-family:var(--mono);font-size:17px;margin-top:5px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.good{color:var(--land2)}
.stat b.bad{color:var(--coral)}
.panel h3{font-weight:400;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);padding-top:12px;border-top:1px solid var(--line)}

.outages{list-style:none;display:grid;gap:6px;max-height:168px;overflow-y:auto}
.outages::-webkit-scrollbar{width:6px}
.outages::-webkit-scrollbar-thumb{background:rgba(120,170,220,.2);border-radius:3px}
.outages li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;font-family:var(--mono);font-size:11.5px;color:var(--dim);padding:7px 9px;border:1px solid rgba(255,111,97,.16);border-radius:8px;background:rgba(255,111,97,.05)}
.outages .n{color:rgba(255,111,97,.8)}
.outages .t{letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.outages .d{color:#ffb1a9;white-space:nowrap}
.outages li.live{border-color:rgba(255,111,97,.45)}
.outages li.live .d{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.empty{font-size:11.5px;color:var(--dim);letter-spacing:.04em;padding:4px 2px}

.speed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{border:1px solid var(--line);border-radius:12px;background:rgba(8,16,36,.5);padding:12px 13px}
.scard .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.scard .val{font-weight:400;font-family:var(--mono);font-size:24px;margin-top:6px;color:var(--land2);font-variant-numeric:tabular-nums;min-height:30px}
.scard .val small{font-size:12px;color:var(--dim);margin-left:4px}
.scard .bar{position:relative;height:4px;border-radius:2px;background:rgba(120,170,220,.16);margin-top:20px}
.scard .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--land2));border-radius:2px;transition:width .25s var(--ease)}
.scard .bar .peak{position:absolute;top:-18px;right:0;text-align:right;transform:translateY(-4px);font-family:var(--mono);font-weight:400;font-size:9px;line-height:1;color:var(--gold);background:none;border:0;padding:0;white-space:nowrap}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .resize-handle{display:none}
  .stage{min-height:0}
  .panel{border-left:0;border-top:1px solid var(--line);padding:14px 16px 16px;gap:10px;max-height:52svh}
  .title{top:14px;left:16px}
  .title h1{font-size:32px;margin-top:6px}
  .title p{display:none}
  .readout{margin-top:10px;gap:12px}
  .readout .ms{font-size:34px}
  .readout .pill{padding:6px 11px;font-size:10px}
  .target{font-size:10.5px}
  .speedcard{left:16px;bottom:12px;width:min(300px,calc(100vw - 32px));padding:10px 12px}
  #graph{height:130px}
  .grid2{gap:9px 12px;padding-top:10px}
  .stat b{font-size:14px}
  .panel h2{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  .readout .dot,.outages li.live .d{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="stage" id="stage" data-state="idle">
    <canvas id="globe" tabindex="0" role="img" aria-label="Rotating dot-matrix globe. Drag to rotate."></canvas>
    <div class="title">
      <p class="eyebrow">A browser connection monitor</p>
      <h1>Ping Watch<span>.</span></h1>
      <div class="readout">
        <span class="pill"><span class="dot"></span><span id="stateTxt">Idle</span></span>
        <span class="ms"><span id="curLat">—</span><small id="curUnit">ms</small></span>
      </div>
      <div class="target" id="targetTxt">no target yet</div>
      <div class="reason" id="reasonTxt"></div>
    </div>
    <div class="speedcard" aria-label="Internet speed test">
      <div class="sphead">
        <span class="sptitle">Internet speed test</span>
      </div>
      <div class="speed">
        <div class="scard">
          <span class="lbl">Download</span>
          <div class="val"><span id="dlVal">—</span><small>Mbps</small></div>
          <div class="bar"><i id="dlBar"></i><b class="peak" id="dlPeak"></b></div>
        </div>
        <div class="scard">
          <span class="lbl">Upload</span>
          <div class="val"><span id="ulVal">—</span><small>Mbps</small></div>
          <div class="bar"><i id="ulBar"></i><b class="peak" id="ulPeak"></b></div>
        </div>
      </div>
    </div>
  </main>

  <div class="resize-handle" id="resizeHandle" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-valuemin="320" aria-valuemax="900" aria-valuenow="440" tabindex="0"></div>
  <aside class="panel" aria-label="Ping Watch controls and statistics">
    <header><h2>Monitor</h2></header>

    <div class="field">
      <label for="url">URL to monitor</label>
      <input id="url" type="url" spellcheck="false" autocomplete="off" placeholder="https://example.com">
    </div>
    <div class="controls">
      <div class="field" style="margin:0">
        <label for="interval">Interval</label>
        <select id="interval" style="width:100%">
          <option value="1000" selected>Every 1 s</option>
          <option value="2000">Every 2 s</option>
          <option value="5000">Every 5 s</option>
          <option value="10000">Every 10 s</option>
        </select>
      </div>
      <div class="field" style="margin:0">
        <label for="window">Graph window</label>
        <select id="window" style="width:100%">
          <option value="30000">30 sec</option>
          <option value="60000">1 min</option>
          <option value="120000">2 min</option>
          <option value="300000">5 min</option>
          <option value="600000">10 min</option>
          <option value="1800000">30 min</option>
          <option value="3600000">1h</option>
          <option value="0" selected>All</option>
        </select>
      </div>
      <div class="field" style="margin:0">
        <label for="clearB">Session</label>
        <button type="button" class="ghost" id="clearB" title="Stop monitoring and clear all samples, stats and outage history">Clear</button>
      </div>
    </div>

    <div class="graphcard">
      <div class="graphhead">
        <span class="lbl">Latency (ms) — live</span>
        <span class="lbl" id="sampleCount"></span>
      </div>
      <div class="gwrap">
        <canvas id="graph" aria-label="Real-time latency graph"></canvas>
        <div class="gtip" id="gtip" aria-hidden="true"><b id="gtipVal"></b><span id="gtipTime"></span></div>
      </div>
    </div>

    <div class="grid2">
      <div class="stat"><span class="lbl">Average</span><b id="sAvg">—</b></div>
      <div class="stat"><span class="lbl">Min / Max</span><b id="sMinMax">—</b></div>
      <div class="stat"><span class="lbl">Uptime</span><b id="sUp">—</b></div>
      <div class="stat"><span class="lbl">Outages</span><b id="sOut">0</b></div>
      <div class="stat"><span class="lbl">Outage time</span><b id="sOutT">0 s</b></div>
      <div class="stat"><span class="lbl">Monitoring for</span><b id="sDur">0 s</b></div>
    </div>

    <h3>Outage history</h3>
    <ul class="outages" id="outageList"></ul>
    <p class="empty" id="outageEmpty">No outages recorded yet.</p>

  </aside>
</div>

<script>
(function(){
'use strict';
var doc = document;
var app=doc.getElementById('app');
var TAU = Math.PI * 2, D2R = Math.PI / 180;
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
function lerp(a,b,t){ return a + (b-a)*t; }
function hx(h){ return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]; }
function mix(a,b,t){ return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]; }
var RM = window.matchMedia('(prefers-reduced-motion: reduce)');
var offlineMode=false;
var detectedOffline=('onLine' in navigator)?!navigator.onLine:false;
var offlineOverride=null;
function applyOfflineMode(){
  var next=offlineOverride===null?detectedOffline:offlineOverride;
  if(offlineMode===next) return;
  offlineMode=next;
  app.classList.toggle('offline-mode',offlineMode);
  if(offlineMode){
    vLon=vLat=0; fly=null; drag=null; cv.classList.remove('drag');
    arcs.length=0; rings.length=0; pendingArcs=0; spawnT=0;
  }
}
function setOfflineMode(value){
  if(arguments.length===0) offlineOverride=null;
  else if(typeof value==='boolean') offlineOverride=value;
  else throw new TypeError('setOfflineMode expects true, false, or no argument to restore automatic detection');
  applyOfflineMode();
  return offlineMode;
}
window.setOfflineMode=setOfflineMode;
var resizeHandle=doc.getElementById('resizeHandle');
var panel=doc.querySelector('.panel');
var resizeStartX=0,resizeStartWidth=0,resizePreviousCursor='';
function currentPanelWidth(){ return panel.getBoundingClientRect().width; }
function setPanelWidth(width){
  var appWidth=app.getBoundingClientRect().width;
  var maxWidth=Math.max(320,Math.min(900,appWidth-210));
  var next=clamp(width,320,maxWidth);
  app.style.setProperty('--panel-width',next+'px');
  resizeHandle.setAttribute('aria-valuemax',String(Math.round(maxWidth)));
  resizeHandle.setAttribute('aria-valuenow',String(Math.round(next)));
  layout();
  graphLayout();
}
function updateResizeValue(){
  if(window.innerWidth>860){
    var maxWidth=Math.max(320,Math.min(900,app.getBoundingClientRect().width-210));
    resizeHandle.setAttribute('aria-valuemax',String(Math.round(maxWidth)));
    resizeHandle.setAttribute('aria-valuenow',String(Math.round(currentPanelWidth())));
  }
}
resizeHandle.addEventListener('pointerdown',function(e){
  if(window.innerWidth<=860||e.button!==0) return;
  resizeStartX=e.clientX;
  resizeStartWidth=currentPanelWidth();
  resizePreviousCursor=doc.body.style.cursor;
  doc.body.style.cursor='col-resize';
  app.classList.add('resizing');
  resizeHandle.setPointerCapture(e.pointerId);
  e.preventDefault();
});
resizeHandle.addEventListener('pointermove',function(e){
  if(!app.classList.contains('resizing')) return;
  setPanelWidth(resizeStartWidth+resizeStartX-e.clientX);
});
function endResize(){
  if(!app.classList.contains('resizing')) return;
  app.classList.remove('resizing');
  doc.body.style.cursor=resizePreviousCursor;
}
resizeHandle.addEventListener('pointerup',endResize);
resizeHandle.addEventListener('pointercancel',endResize);
resizeHandle.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft'){ setPanelWidth(currentPanelWidth()+20); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ setPanelWidth(currentPanelWidth()-20); e.preventDefault(); }
  else if(e.key==='Home'){ setPanelWidth(900); e.preventDefault(); }
  else if(e.key==='End'){ setPanelWidth(320); e.preventDefault(); }
});
window.addEventListener('resize',updateResizeValue);

/* ============================================================
   THE GLOBE — dot-matrix sphere, land mask, probe arcs
   ============================================================ */
var cv = doc.getElementById('globe'), ctx = cv.getContext('2d');
var stage = doc.getElementById('stage');
var W=0,H=0,DPR=1,CX=0,CY=0,R=200;
var lon0=-28, lat0=16, vLon=0, vLat=0, autoSpin=true, lastInput=-1e9, spinK=1, fly=null;

/* land mask: 72x36 cells of 5 degrees, run-length encoded ("12.21#" = 12 ocean, 21 land) */
var MASK = [
  '72.','19.13#40.','12.21#5.3#14.3#14.','11.11#2.8#14.2#1.16#7.',
  '2#1.17#1.3#1.5#2.1#5.34#','3.14#4.2#2.3#4.2#3.35#','4.2#3.8#4.3#10.2#1.2#1.24#3.2#3.',
  '10.15#9.2#1.28#2.1#4.','11.12#1.2#9.30#7.','11.11#12.3#1.1#1.2#2.2#1.15#2.1#7.',
  '11.10#13.2#2.1#1.6#1.15#1.1#8.','12.8#14.5#1.1#2.17#2.1#9.','13.4#2.1#13.13#1.13#12.',
  '14.2#3.2#12.10#1.4#2.9#13.','16.3#1.2#11.11#1.2#4.2#2.2#3.1#11.','18.1#2.1#11.12#6.1#3.3#2.1#11.',

    var timeoutMs=Math.min(10000,Math.max(4000,intervalMs));
    var to=ctrl?setTimeout(function(){ if(!done){ done=true; try{ctrl.abort();}catch(e){} resolve({ok:false,ms:performance.now()-t0,reason:'timeout'}); } },timeoutMs):null;

      .then(function(){
        if(done) return;
        done=true; if(to) clearTimeout(to);
        resolve({ok:true,ms:performance.now()-t0});

      .catch(function(){

      }
    } else {
      recordSample(res);
    }
    if(running) schedule();
  });
}
function schedule(){
  if(timer) clearTimeout(timer);
  timer=setTimeout(tick,intervalMs);
}
function recordSample(res){
  var t=nowMs();
  if(res.ok){
    okCount++; sumMs+=res.ms;
    if(res.ms<minMs) minMs=res.ms;
    if(res.ms>maxMs) maxMs=res.ms;
    /* close any open outage — the target answered again */
    for(var i=outages.length-1;i>=0;i--){
      if(outages[i].end==null){ outages[i].end=t; break; }
    }
    pendingArcs++;  /* golden probe arc on the globe */
  } else {
    var open=outages.length&&outages[outages.length-1].end==null;
    if(!open) outages.push({start:t,end:null});
  }
  samples.push({t:t,ms:res.ok?res.ms:null,reason:res.reason});
  if(samples.length>MAX_SAMPLES) samples.splice(0,samples.length-MAX_SAMPLES);
  paintStatus(res);
  paintStats();
  paintOutages();
  graphDirty=true;
}
function paintStatus(res){
  updateDetectedOffline(res);
  var ok=res&&res.ok;
  stage.dataset.state=ok?'on':'off';
  stateTxt.textContent=ok?'Online':'Offline';
  if(ok){
    curLatEl.textContent=Math.round(res.ms);
    reasonTxt.textContent='';
  } else {
    curLatEl.textContent='—';
    reasonTxt.textContent=(res&&res.reason?('last check: '+res.reason):'')+(lastOnline===false?' · navigator.onLine = false':'');
  }
  targetTxt.textContent=target?(usingDefaultTarget?'Default connection check':target.replace(/^https?:\/\//,'')):'no target yet';
  healthTarget=ok?0:(res?1:healthTarget);
  graphDirty=true;
}
var healthTarget=0;
setInterval(function(){ healthMix=lerp(healthMix,healthTarget,0.06); },50);

function paintStats(){
  var dur=monitoringDuration();
  var outT=totalOutageMs();
  sAvg.textContent=okCount?(Math.round(sumMs/okCount)+' ms'):'—';
  sMinMax.textContent=(okCount&&minMs!==Infinity)?(Math.round(minMs)+' / '+Math.round(maxMs)+' ms'):'—';
  sUp.textContent=dur>0?((100*(dur-outT)/dur).toFixed(2)+' %'):'—';
  sOut.textContent=String(outages.length);
  sOut.className=outages.length?'stat-b bad':'stat-b';
  sOutT.textContent=fmtDur(outT);
  sDur.textContent=fmtDur(dur);
  sampleCount.textContent=samples.length?samples.length+' samples':'';
}
sOut.className=''; /* styling handled inline below */
function paintOutages(){
  outageList.innerHTML='';
  outageEmpty.style.display=outages.length?'none':'';
  for(var i=outages.length-1;i>=0&&i>=outages.length-60;i--){
    var o=outages[i];
    var live=o.end==null;
    var dur=(live?nowMs():o.end)-o.start;
    var li=doc.createElement('li');
    if(live) li.className='live';
    li.innerHTML='<span class="n">#'+(i+1)+'</span>'+
      '<span class="t">'+fmtClock(o.start)+' → '+(live?'ongoing':fmtClock(o.end))+'</span>'+
      '<span class="d">'+fmtDur(dur)+(live?'…':'')+'</span>';
    outageList.appendChild(li);
  }
  if(!outages.length) outageEmpty.style.display='';
}
/* live refresh of ongoing outage + duration while running */
setInterval(function(){
  if(!running&&!outages.length) return;
  if(outages.length&&outages[outages.length-1].end==null){ paintOutages(); }
  if(running) paintStats();
},1000);

/* Monitoring lifecycle: typing/changing the URL (re)starts monitoring
   automatically — no start/stop button. Clear stops everything and wipes
   the session. */
function startMonitoring(){
  var rawUrl=urlIn.value.trim();
  var href=rawUrl?normalizeUrl(rawUrl):DEFAULT_TARGET;
  if(!href){
    urlIn.classList.add('err');
    return;
  }
  urlIn.classList.remove('err');
  usingDefaultTarget=!rawUrl;
  var isNewTarget=(href!==target);
  target=href;
  intervalMs=parseInt(intSel.value,10)||1000;
  if(!running||isNewTarget){
    if(runStart){ runAccum+=nowMs()-runStart; runStart=0; }
    warmupRemaining=2;
  }
  if(!running){
    running=true;
  }
  paintStats();
  if(isNewTarget){
    /* kick off an immediate check when the target just changed */
    if(timer){ clearTimeout(timer); timer=null; }
    if(!checking) tick();
  } else if(!timer&&!checking){
    schedule();
  }
}
function stopMonitoring(){
  running=false;
  if(timer){ clearTimeout(timer); timer=null; }
  if(runStart){ runAccum+=nowMs()-runStart; runStart=0; }
  stage.dataset.state='idle';
  stateTxt.textContent='Idle';
  paintStats();
}
urlIn.addEventListener('input',function(){
  urlIn.classList.remove('err');
  if(!urlIn.value.trim()||normalizeUrl(urlIn.value)) startMonitoring();
});
urlIn.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    e.preventDefault();
    if(!urlIn.value.trim()||normalizeUrl(urlIn.value)) startMonitoring();
    else urlIn.classList.add('err');
  }
});
intSel.addEventListener('change',function(){
  intervalMs=parseInt(intSel.value,10)||1000;
  if(running){ schedule(); }   /* applies immediately, even mid-run */
});
clearB.addEventListener('click',function(){
  stopMonitoring();
  samples=[]; outages=[]; okCount=0; sumMs=0;
  minMs=Infinity; maxMs=-Infinity; runAccum=0; runStart=0; lastOnline=null; warmupRemaining=0;
  stage.dataset.state='idle';
  stateTxt.textContent='Idle';
  curLatEl.textContent='—';
  reasonTxt.textContent='';
  targetTxt.textContent='no target yet';
  healthTarget=0;
  paintStats(); paintOutages();
  graphDirty=true;
});

/* ============================================================
   THE GRAPH — real-time line chart with outage bands + hover
   ============================================================ */
var gcv=doc.getElementById('graph'), gctx=gcv.getContext('2d');
var gtip=doc.getElementById('gtip'), gtipVal=doc.getElementById('gtipVal'), gtipTime=doc.getElementById('gtipTime');
var GW=0,GH=0,GDPR=1,graphDirty=true,hoverX=-1;
var GPAD={l:48,r:12,t:12,b:22};
function graphLayout(){
  var r=gcv.getBoundingClientRect();
  GW=r.width; GH=r.height;
  GDPR=Math.min(2,window.devicePixelRatio||1);
  gcv.width=Math.round(GW*GDPR); gcv.height=Math.round(GH*GDPR);
  graphDirty=true;
}
function visibleSamples(){
  var win=parseInt(winSel.value,10);
  if(!samples.length) return samples;
  if(!win) return samples;
  var t1=samples[samples.length-1].t;
  var i=samples.length-1;
  while(i>0&&samples[i-1].t>=t1-win) i--;
  return samples.slice(i);
}
function niceStep(range,ticks){
  var raw=range/ticks, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
  var norm=raw/mag;
  var step=(norm<1.5?1:norm<3?2:norm<7?5:10)*mag;
  return step;
}
/* latency → colour ramp: cyan (fastest, at the top) → green → yellow → orange (slow peak).
   Benchmarks adapt to the session: fast checks push the whole ramp down. */
var rampA=hx('#a6fff2'), rampB=hx('#3ddc84'), rampC=hx('#ffd166'), rampD=hx('#ff6f61');
var benchLow=20, benchHigh=200;
function latColor(ms,alpha){
  var t=clamp((ms-benchLow)/(benchHigh-benchLow),0,1);
  var c;
  if(t<0.34){ c=mix(rampA,rampB,t/0.34); }
  else if(t<0.67){ c=mix(rampB,rampC,(t-0.34)/0.33); }
  else { c=mix(rampC,rampD,(t-0.67)/0.33); }
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha==null?1:alpha)+')';
}
function updateBench(){
  /* rolling min/max of recent successful samples keeps colours meaningful */
  var vs=visibleSamples(),i,mn=Infinity,mx=-Infinity,n=0;
  for(i=vs.length-1;i>=0&&n<120;i--){ if(vs[i].ms!=null){ if(vs[i].ms<mn)mn=vs[i].ms; if(vs[i].ms>mx)mx=vs[i].ms; n++; } }
  if(mn!==Infinity){
    var span=Math.max(30,(mx-mn)*0.9);
    benchLow=Math.max(1,mn*0.9);
    benchHigh=benchLow+span*2.2;
  }
}
function drawGraph(){
  gctx.setTransform(GDPR,0,0,GDPR,0,0);
  gctx.clearRect(0,0,GW,GH);
  var vs=visibleSamples();
  var win=parseInt(winSel.value,10);
  var t1=samples.length?samples[samples.length-1].t:nowMs();
  var t0=win?(t1-win):(vs.length?vs[0].t:t1-60000);
  if(t1-t0<1000) t0=t1-1000;
  var plotW=GW-GPAD.l-GPAD.r, plotH=GH-GPAD.t-GPAD.b;
  function X(t){ return GPAD.l+(t-t0)/(t1-t0)*plotW; }
  /* y range from visible successful samples */
  var lo=0,hi=100,i;
  var mn=Infinity,mx=-Infinity;
  for(i=0;i<vs.length;i++){ var m=vs[i].ms; if(m!=null){ if(m<mn)mn=m; if(m>mx)mx=m; } }
  if(mn!==Infinity){
    lo=0; hi=Math.max(mx*1.15,mn*2+20,50);
  }
  var range=hi-lo||1;
  function Y(v){ return GPAD.t+plotH-(v-lo)/range*plotH; }
  /* horizontal grid + labels */
  var step=niceStep(range,4);
  gctx.font='10px '+getComputedStyle(doc.body).getPropertyValue('--mono')||'monospace';
  gctx.textAlign='right'; gctx.textBaseline='middle';
  for(var v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step){
    var y=Y(v);
    gctx.strokeStyle='rgba(120,170,220,.12)';
    gctx.lineWidth=1;
    gctx.beginPath(); gctx.moveTo(GPAD.l,y); gctx.lineTo(GW-GPAD.r,y); gctx.stroke();
    gctx.fillStyle='rgba(200,222,245,.5)';
    gctx.fillText(Math.round(v),GPAD.l-6,y);
  }
  /* vertical time ticks */
  var tstep=niceStep((t1-t0)/1000,5)*1000;
  gctx.textAlign='center'; gctx.textBaseline='top';
  for(var tt=Math.ceil(t0/tstep)*tstep; tt<=t1; tt+=tstep){
    var xx=X(tt);
    gctx.strokeStyle='rgba(120,170,220,.08)';
    gctx.beginPath(); gctx.moveTo(xx,GPAD.t); gctx.lineTo(xx,GPAD.t+plotH); gctx.stroke();
    gctx.fillStyle='rgba(200,222,245,.45)';
    gctx.fillText(fmtClock(tt),xx,GPAD.t+plotH+6);
  }
  /* outage bands (from outage records) */
  for(i=0;i<outages.length;i++){
    var o=outages[i];
    var oe=o.end!=null?o.end:nowMs();
    if(oe<t0||o.start>t1) continue;
    var x0=Math.max(GPAD.l,X(Math.max(o.start,t0)));
    var x1=Math.min(GW-GPAD.r,X(Math.min(oe,t1)));
    if(x1>x0){
      gctx.fillStyle='rgba(255,111,97,.13)';
      gctx.fillRect(x0,GPAD.t,x1-x0,plotH);
      gctx.fillStyle='rgba(255,111,97,.4)';
      gctx.fillRect(x0,GPAD.t,1,plotH);
      gctx.fillRect(x1-1,GPAD.t,1,plotH);
    }
  }
  /* latency line — broken wherever failures intervened, coloured by latency */
  gctx.save();
  gctx.beginPath(); gctx.rect(GPAD.l,GPAD.t,plotW,plotH); gctx.clip();
  updateBench();
  var intervalGuess=intervalMs;
  var segs=[];   /* runs of consecutive successful points */
  var cur=null;
  for(i=0;i<vs.length;i++){
    var s=vs[i];
    if(s.ms==null){ cur=null; continue; }
    if(!cur){ cur={pts:[]}; segs.push(cur); }
    cur.pts.push(s);
  }
  /* area fill under the line: one subtle fill per segment */
  for(i=0;i<segs.length;i++){
    var pts=segs[i].pts; if(pts.length<2) continue;
    gctx.beginPath();
    for(var j=0;j<pts.length;j++){
      var px=X(pts[j].t), py=Y(pts[j].ms);
      if(j===0) gctx.moveTo(px,py); else gctx.lineTo(px,py);
    }
    gctx.lineTo(X(pts[pts.length-1].t),GPAD.t+plotH);
    gctx.lineTo(X(pts[0].t),GPAD.t+plotH);
    gctx.closePath();
    gctx.fillStyle='rgba(90,209,230,.06)';
    gctx.fill();
  }
  /* line: per-segment colour = latency ramp between the two endpoints */
  gctx.lineWidth=1.6;
  gctx.lineJoin='round';
  gctx.lineCap='round';
  for(i=0;i<segs.length;i++){
    var pts2=segs[i].pts;
    for(var j2=1;j2<pts2.length;j2++){
      var p0=pts2[j2-1], p1=pts2[j2];
      if(p1.t-p0.t>intervalGuess*2.5) continue;
      var mid=(p0.ms+p1.ms)/2;
      gctx.strokeStyle=latColor(mid,0.95);
      gctx.beginPath();
      gctx.moveTo(X(p0.t),Y(p0.ms));
      gctx.lineTo(X(p1.t),Y(p1.ms));
      gctx.stroke();
    }
  }
  /* last point marker, coloured by its own latency */
  var lastOk=null;
  for(i=vs.length-1;i>=0;i--){ if(vs[i].ms!=null){ lastOk=vs[i]; break; } }
  if(lastOk){
    var lx=X(lastOk.t), ly=Y(lastOk.ms);
    var lcol=latColor(lastOk.ms);
    gctx.fillStyle=lcol;
    gctx.beginPath(); gctx.arc(lx,ly,2.6,0,TAU); gctx.fill();
    gctx.strokeStyle=lcol.replace(/,[^,]+\)$/,',.4)');
    gctx.lineWidth=1;
    gctx.beginPath(); gctx.arc(lx,ly,5.5,0,TAU); gctx.stroke();
  }
  gctx.restore();
  /* hover crosshair */
  if(hoverX>=GPAD.l&&hoverX<=GW-GPAD.r&&vs.length){
    var tH=t0+(hoverX-GPAD.l)/plotW*(t1-t0);
    var best=null,bd=1e18;
    for(i=0;i<vs.length;i++){ var d=Math.abs(vs[i].t-tH); if(d<bd){ bd=d; best=vs[i]; } }
    if(best&&bd<(t1-t0)/plotW*10){
      gctx.strokeStyle='rgba(232,243,255,.35)';
      gctx.lineWidth=1;
      gctx.setLineDash([3,3]);
      gctx.beginPath(); gctx.moveTo(X(best.t),GPAD.t); gctx.lineTo(X(best.t),GPAD.t+plotH); gctx.stroke();
      gctx.setLineDash([]);
      if(best.ms!=null){
        gctx.fillStyle='#a6fff2';
        gctx.beginPath(); gctx.arc(X(best.t),Y(best.ms),3.2,0,TAU); gctx.fill();
      } else {
        gctx.fillStyle='#ff6f61';
        gctx.fillRect(X(best.t)-2,GPAD.t,4,plotH);
      }
      gtipVal.textContent=best.ms!=null?(Math.round(best.ms)+' ms'):'OFFLINE';
      gtipTime.textContent=fmtClock(best.t)+' · '+(best.ms!=null?'success':(best.reason||'failed'));
      gtip.className='gtip on'+(best.ms==null?' off':'');
      var tw=gtip.offsetWidth, th2=gtip.offsetHeight;
      var tx=clamp(X(best.t)+10,4,GW-tw-4), ty=clamp(GPAD.t+4,4,GH-th2-4);
      gtip.style.transform='translate('+tx.toFixed(1)+'px,'+ty.toFixed(1)+'px)';
      return;
    }
  }
  gtip.className='gtip';
}
gcv.addEventListener('pointermove',function(e){
  var r=gcv.getBoundingClientRect();
  hoverX=e.clientX-r.left;
  graphDirty=true;
});
gcv.addEventListener('pointerleave',function(){ hoverX=-1; gtip.className='gtip'; graphDirty=true; });
winSel.addEventListener('change',function(){ graphDirty=true; });
(function graphLoop(){
  if(graphDirty&&!doc.hidden){ drawGraph(); graphDirty=false; }
  requestAnimationFrame(graphLoop);
})();
window.addEventListener('resize',function(){ graphLayout(); });

/* ============================================================
   SPEED TEST — approximate, via speed.cloudflare.com (CORS-enabled).
   Starts automatically and keeps cycling in the background. The
   cadence is capped at one full cycle every ~30 s — running a
   10 MB download every single second would burn bandwidth and get
   rate-limited (HTTP 429), so repeated failures back off gradually.
   Failures are caught and never affect the latency monitor.
   ============================================================ */
var dlVal=doc.getElementById('dlVal'), dlBar=doc.getElementById('dlBar'), dlPeak=doc.getElementById('dlPeak');
var ulVal=doc.getElementById('ulVal'), ulBar=doc.getElementById('ulBar'), ulPeak=doc.getElementById('ulPeak');
var speedRunning=false, speedTimer=null, speedDelay=30000;
var SPEED_MIN=30000, SPEED_MAX=300000;   /* cycle period, backs off on failures */
var peakDl=0, peakUl=0;   /* session peaks in Mbps — bars scale 0..peak */
var lastDl=null, lastUl=null;

function fmtMbps(v){ return v<10?v.toFixed(2):String(Math.round(v)); }
function setPeak(peakEl,barEl,val,peak){
  /* track scale runs 0..peak; the peak number sits at the right end */
  var pct=peak>0?clamp(val/peak*100,0,100):0;
  barEl.style.width=pct.toFixed(1)+'%';
  peakEl.textContent=fmtMbps(peak);
}
function warmUp(){
  /* small fetch to open TCP+TLS so the measured window is mostly payload */
  return fetch('https://speed.cloudflare.com/__down?bytes=1000&r='+Math.random(),{cache:'no-store'})
    .then(function(r){ return r.arrayBuffer(); })
    .catch(function(){});
}
function downloadTest(bytes,onProgress){
  return fetch('https://speed.cloudflare.com/__down?bytes='+bytes+'&r='+Math.random(),{cache:'no-store'})
    .then(function(resp){
      if(resp.status===429) throw new Error('rate-limited');
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      var total=+(resp.headers.get('content-length')||bytes);
      if(resp.body&&resp.body.getReader){
        var reader=resp.body.getReader(), received=0;
        var t0=performance.now();
        return new Promise(function(resolve,reject){
          function pump(){
            reader.read().then(function(chunk){
              if(chunk.done){
                var secs=(performance.now()-t0)/1000;
                resolve({mbps:(received*8/1e6)/secs,bytes:received});
                return;
              }
              received+=chunk.value.length;
              onProgress(total?received/total:0);
              pump();
            }).catch(reject);
          }
          pump();
        });
      }
      /* older browsers: read whole blob */
      var t1=performance.now();
      return resp.arrayBuffer().then(function(buf){
        var secs=(performance.now()-t1)/1000;
        return {mbps:(buf.byteLength*8/1e6)/secs,bytes:buf.byteLength};
      });
    });
}
function uploadTest(bytes,onProgress){
  var payload=new Uint8Array(bytes);
  /* crypto.getRandomValues is limited to 65536 bytes per call — fill in chunks */
  if(window.crypto&&crypto.getRandomValues){
    var CH=65536;
    for(var off=0;off<bytes;off+=CH){
      crypto.getRandomValues(payload.subarray(off,Math.min(off+CH,bytes)));
    }
  }
  var blob=new Blob([payload]);
  onProgress(0.15);
  var t0=performance.now();
  return fetch('https://speed.cloudflare.com/__up?r='+Math.random(),{method:'POST',body:blob,cache:'no-store'})
    .then(function(resp){
      if(resp.status===429) throw new Error('rate-limited');
      if(!resp.ok) throw new Error('HTTP '+resp.status);
      return resp.arrayBuffer();
    })
    .then(function(){
      onProgress(1);
      var secs=(performance.now()-t0)/1000;
      return {mbps:(bytes*8/1e6)/secs,bytes:bytes};
    });
}
function runSpeedTest(){
  if(speedRunning) return;
  speedRunning=true;
  dlVal.textContent='…'; ulVal.textContent='—';
  warmUp()
    .then(function(){
      return downloadTest(10*1024*1024,function(p){ dlBar.style.width=Math.round(p*100)+'%'; });
    })
    .then(function(res){
      if(res.mbps>peakDl){ peakDl=res.mbps; }
      lastDl=res.mbps;
      dlVal.textContent=fmtMbps(res.mbps);
      setPeak(dlPeak,dlBar,res.mbps,peakDl);
      ulVal.textContent='…';
      return uploadTest(2*1024*1024,function(p){ ulBar.style.width=Math.round(p*100)+'%'; });
    })
    .then(function(res){
      if(res.mbps>peakUl){ peakUl=res.mbps; }
      lastUl=res.mbps;
      ulVal.textContent=fmtMbps(res.mbps);
      setPeak(ulPeak,ulBar,res.mbps,peakUl);
      speedRunning=false;
      speedDelay=SPEED_MIN;               /* success — normal cadence */
      scheduleSpeedTest();
    })
    .catch(function(){
      /* rate-limited or network gone — keep the last good reading, back off */
      dlVal.textContent=lastDl!=null?fmtMbps(lastDl):'—';
      ulVal.textContent=lastUl!=null?fmtMbps(lastUl):'—';
      if(peakDl>0) setPeak(dlPeak,dlBar,lastDl||0,peakDl);
      if(peakUl>0) setPeak(ulPeak,ulBar,lastUl||0,peakUl);
      speedRunning=false;
      speedDelay=Math.min(SPEED_MAX,speedDelay*2);
      scheduleSpeedTest();
    });
}
function scheduleSpeedTest(){
  if(speedTimer) clearTimeout(speedTimer);
  speedTimer=setTimeout(runSpeedTest,speedDelay);
}

/* ============================================================
   BOOT
   ============================================================ */
layout();
graphLayout();
updateResizeValue();
paintStats();
paintOutages();
/* auto-start monitoring the default URL right away */
startMonitoring();
/* auto-start the speed test loop — first cycle waits 2 s so the page
   settles (and the first latency checks run) without interference */
if(speedTimer) clearTimeout(speedTimer);
speedTimer=setTimeout(runSpeedTest,2000);
for(var s0=0;s0<12;s0++) spawnArc(null,null,Math.random()*0.9,false);
applyOfflineMode();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
